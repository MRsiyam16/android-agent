<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopFlow — Checkout flow · App Flow Canvas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">Framer</div>
      <div class="divider"></div>
      <div class="crumbs">
        <span class="crumb-project">ShopFlow</span>
        <span>/</span>
        <div class="crumb-flow">
          Checkout flow
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <div class="recording">
        <span class="rec-dot"></span>
        Recording session · <span id="recTimer">00:00</span>
      </div>
      <div class="avatars">
        <div class="avatar" style="background:#6a4cf5;">JT</div>
        <div class="avatar" style="background:#ff7a3d;">MP</div>
        <div class="avatar avatar-more">+3</div>
      </div>
      <div class="minimap" title="Minimap">
        <div class="minimap-inner" id="minimap"></div>
      </div>
      <button class="btn btn-secondary btn-sm">Upload screenshots</button>
      <button class="btn btn-primary btn-sm">Share</button>
    </div>
  </header>

  <!-- CANVAS AREA -->
  <main class="canvas-area" id="canvasArea">
    <div class="canvas" id="canvas">

      <svg class="arrows-svg" id="arrowsSvg">
        <defs>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#0099ff"></path>
          </marker>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#ff5577"></path>
          </marker>
        </defs>
        <g id="arrowPaths"></g>
      </svg>

      <div id="arrowLabels"></div>
      <div id="markers"></div>
      <div id="screens"></div>
      <div id="stickyNotes"></div>
      <div id="textBlocks"></div>

    </div>

    <!-- LEFT FLOATING TOOLBAR -->
    <div class="toolbar">
      <div class="tool-btn" id="toolSelect" title="Select / drag">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z"></path></svg>
      </div>
      <div class="tool-btn" title="Pan">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"></path><path d="M14 10V4a2 2 0 0 0-4 0v6"></path><path d="M10 10.5V6a2 2 0 0 0-4 0v8"></path><path d="M6 14v-2a2 2 0 0 0-4 0v3a8 8 0 0 0 8 8h2a8 8 0 0 0 8-8v-4a2 2 0 0 0-4 0v2"></path></svg>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-btn" id="toolNote" title="Add Sticky Note">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
      </div>
      <div class="tool-btn" id="toolText" title="Add text / heading">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="12" y1="4" x2="12" y2="20"></line><line x1="8" y1="20" x2="16" y2="20"></line></svg>
      </div>
      <div class="tool-btn" title="Comment">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-btn" id="zoomOut" title="Zoom out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
      <div class="zoom-pct" id="zoomPct">100%</div>
      <div class="tool-btn" id="zoomIn" title="Zoom in">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
      <div class="tool-btn" id="fitScreen" title="Fit to screen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
      </div>
    </div>

    <!-- LEGEND -->
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#22c55e;"></span>Working · <span id="countWorking">5</span></div>
      <div class="legend-sep"></div>
      <div class="legend-item"><span class="dot" style="background:#ff5577;"></span>Broken · <span id="countBroken">1</span></div>
      <div class="legend-sep"></div>
      <div class="legend-item"><span class="dot" style="background:var(--ink-muted);"></span>Untested · <span id="countUntested">1</span></div>
      <div class="legend-sep"></div>
      <div class="legend-verified">6/7 links verified</div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
