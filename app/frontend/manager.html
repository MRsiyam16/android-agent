<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Tester AI — Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<!-- base for the tokens, agent for the chat log — the conversation looks the same here as in
     the cockpit because it is the same conversation, one tier up. manager.css owns everything
     else. No vis-network: there is no graph on this page and never will be. -->
<link rel="stylesheet" href="/static/css/base.css?v=22">
<link rel="stylesheet" href="/static/css/agent.css?v=21">
<link rel="stylesheet" href="/static/css/manager.css?v=8">
</head>
<body>

<!--
  The product, not a project.

  The cockpit at / is built around one app on one device: a project pill, a module list, a
  phone frame, a flow graph. Everything on this page is *across* apps — which is why it could
  never be more than a pill and a sheet over there, and why it is its own page here.

  Same three-column reading order as the cockpit, so switching between them costs nothing:
  what you choose from on the left, what you look at in the middle, what you talk to on the
  right. What is missing is the point — no device controls, no screenshots, no tap target.
  The tier this page drives has no device registered at all.
-->
<div class="shell">

  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark"></span>
        QA Tester AI
      </div>
      <div class="divider"></div>
      <div class="eco-pill" id="ecoName">—</div>
      <div class="eco-headline" id="ecoHeadline">Loading…</div>

      <!--
        The running indicator.

        A sweep runs for hours across a dozen modules, entirely between the manager's turns.
        Without this the only evidence it exists is a number moving on a card, so the honest
        question "is anything happening right now?" had no answer anywhere on the page.

        Hidden when nothing is running — an always-present "0 running" is a thing to learn to
        ignore, and then it is ignored on the day it matters.
      -->
      <button class="campaign-strip" id="campaignStrip" hidden
              title="Jump to the sweep">
        <span class="campaign-dot"></span>
        <span class="campaign-text" id="campaignText"></span>
        <span class="campaign-bar"><i id="campaignBar"></i></span>
      </button>
    </div>

    <div class="topbar-right">
      <!-- Back to the cockpit. A link, not a tab: they are two pages, and pretending
           otherwise is what made this awkward the first time. -->
      <a class="stat-pill link-pill" href="/" title="Back to the testing cockpit — one app, one device">↩ Cockpit</a>
      <div class="conn-indicator" id="conn"><span class="conn-dot"></span><span id="connLabel">connecting</span></div>
      <button class="rail-toggle" id="toggleRightBtn" title="Toggle the manager rail  (])">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="15" y1="4" x2="15" y2="20"></line></svg>
      </button>
    </div>
  </header>

  <div class="body">

    <!-- LEFT: what you choose from -->
    <nav class="rail-left" id="railLeft">
      <div class="rail-title">Overview</div>
      <button class="nav-item" id="navOverview" data-view="overview">
        <span class="nav-label">The whole product</span>
      </button>

      <div class="rail-title">Apps</div>
      <div id="appNav"></div>

      <div class="rail-title">Defects</div>
      <button class="nav-item" data-view="clusters">
        <span class="nav-label">Clusters</span>
        <span class="nav-count" id="countClusters">—</span>
      </button>
      <button class="nav-item" data-view="unclustered">
        <span class="nav-label">Unclustered</span>
        <span class="nav-count" id="countUnclustered">—</span>
      </button>

      <div class="rail-title">Work</div>
      <button class="nav-item" data-view="campaigns">
        <span class="nav-label">Jobs</span>
        <span class="nav-count" id="countCampaigns">—</span>
      </button>
      <button class="nav-item" data-view="scratchpad">
        <span class="nav-label">Scratchpad</span>
        <span class="nav-count" id="countNotes">—</span>
      </button>
      <button class="nav-item" data-view="retests">
        <span class="nav-label">Re-tests</span>
        <span class="nav-count" id="countRetests">—</span>
      </button>
      <button class="nav-item" data-view="reports">
        <span class="nav-label">Reports</span>
      </button>

      <div class="rail-foot" id="railFoot"></div>
    </nav>

    <!-- CENTRE: what you look at -->
    <main class="canvas-col">
      <div class="canvas-head">
        <div>
          <div class="canvas-title" id="canvasTitle">The whole product</div>
          <div class="canvas-sub" id="canvasSub"></div>
        </div>
        <button class="chip-btn" id="refreshBtn" title="Re-read everything from disk">↻ Refresh</button>
      </div>
      <div class="canvas" id="canvas"></div>
    </main>

    <!-- RIGHT: what you talk to -->
    <aside class="rail-right" id="railRight">
      <div class="agent-head">
        <div class="agent-head-left">
          <span class="rail-title flush">Manager</span>
          <span class="agent-state" id="agentState">idle</span>
        </div>
        <div class="agent-head-right">
          <span class="agent-model" id="agentModel">—</span>
          <button class="chip-btn" id="agentStopBtn" disabled>■ Stop</button>
        </div>
      </div>

      <!-- The picker sits on its own row rather than in the head: at 400px the head could not
           hold a select as well, and the Stop button was the thing that got clipped off the
           edge — the one control you reach for when something is going wrong. -->
      <div class="rail-toggle-row">
        <label class="chip-toggle"><input type="checkbox" id="traceToggle" checked> Tool trace</label>
        <select class="agent-select" id="agentModelPicker" title="Model for the manager"></select>
      </div>

      <div class="chat-log-wrap">
        <div class="chat-log" id="chatLog"></div>
        <button class="chat-jump" id="chatJump" hidden>↓ Jump to latest</button>
      </div>

      <div class="agent-working" id="agentWorking">
        <span class="agent-dots"><i></i><i></i><i></i></span>
        <span class="agent-working-text" id="agentWorkingText">Thinking…</span>
        <span class="agent-working-timer" id="agentWorkingTimer">0:00</span>
      </div>

      <div class="agent-blocked" id="agentBlocked">
        <div class="agent-blocked-head">
          <div class="agent-blocked-label" id="agentBlockedLabel">The manager needs an answer</div>
          <button type="button" class="agent-blocked-done" id="agentBlockedDone">✓ Done</button>
        </div>
        <div class="agent-blocked-question" id="agentBlockedQuestion"></div>
      </div>

      <form class="chat-input-row" id="chatForm">
        <textarea id="chatInput" rows="2" placeholder="Ask about the product — e.g. “which defects are cross-app and still open?”" autocomplete="off"></textarea>
        <button type="submit" id="chatSend">Send</button>
      </form>
    </aside>

  </div>
</div>

<script type="module" src="/static/js/manager/main.js?v=8"></script>
</body>
</html>
