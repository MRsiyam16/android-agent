[pytest]
# Only tests/ — the top-level test_*.py files are ad-hoc driver scripts that talk to a real
# phone and would otherwise be collected, connect to a device, and hang the suite.
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# server.py still uses @app.on_event; that is FastAPI's deprecation to fix, not a test failure.
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:server
